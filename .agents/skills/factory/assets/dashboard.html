<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineering Guard Factory</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-sunken: #eef0f3;
    --surface-hover: #f8f9fb;
    --line: #e2e4e9;
    --line-strong: #cbcfd8;
    --ink: #14161b;
    --ink-soft: #3f4350;
    --muted: #5f6478;
    --muted-on-surface: #5f6478;
    /* Code surfaces (inline code, code blocks) need their own token: they must
       always read as distinctly raised/tinted against the content background,
       which --surface-sunken does not guarantee once it's reused to mean
       "slightly darker" in dark mode (see below). */
    --code-bg: #eef0f3;
    --code-border: #dde1e8;

    --pass: #15803d;
    --pass-bg: #e9f6ee;
    --pass-line: #bfe4cd;
    --changes: #b45309;
    --changes-bg: #fdf3e3;
    --changes-line: #f3d9a9;
    --pending: #5f6478;
    --pending-bg: #eef0f3;
    --pending-line: #d7dae1;
    --na: #5f6478;
    --na-bg: #eef0f3;
    --na-line: #d7dae1;
    --human: #0f766e;
    --human-bg: #e6f5f2;
    --human-line: #bfe3dc;
    --danger: #b91c1c;
    --danger-bg: #fbeaea;
    --danger-line: #f0c6c6;

    --focus: #2563eb;
    --link: #1d4ed8;
    --selection: rgba(37, 99, 235, 0.22);
    --scrollbar: #c7cad3;
    --scrollbar-track: transparent;

    --shadow-sm: 0 1px 2px rgba(20, 22, 27, 0.06);
    --shadow-md: 0 2px 6px rgba(20, 22, 27, 0.07), 0 1px 2px rgba(20, 22, 27, 0.06);
    --shadow-lg: 0 16px 40px rgba(20, 22, 27, 0.16), 0 4px 10px rgba(20, 22, 27, 0.08);
    --shadow-float: 0 8px 20px rgba(20, 22, 27, 0.10);
  }

  body.dark {
    color-scheme: dark;
    --bg: #0b0d12;
    --surface: #15171f;
    --surface-sunken: #0f1116;
    --surface-hover: #1b1e27;
    --line: #262a35;
    --line-strong: #363b49;
    --ink: #eef0f4;
    --ink-soft: #c6cad6;
    --muted: #8a8fa3;
    --muted-on-surface: #8a8fa3;
    /* Code surfaces read as distinctly raised in dark mode: a lighter fill than
       --surface (not a darker "sunken" one) plus a visibly brighter border, so
       inline code and code blocks don't blend into the surrounding reading pane. */
    --code-bg: #272b38;
    --code-border: #3a3f52;

    --pass: #4ade80;
    --pass-bg: #113222;
    --pass-line: #1f5436;
    --changes: #fbbf5a;
    --changes-bg: #3a2a0f;
    --changes-line: #5c431a;
    --pending: #8a8fa3;
    --pending-bg: #1b1e27;
    --pending-line: #30354399;
    --na: #8a8fa3;
    --na-bg: #1b1e27;
    --na-line: #303543;
    --human: #2dd4bf;
    --human-bg: #0e2b27;
    --human-line: #1b4b43;
    --danger: #fca5a5;
    --danger-bg: #3a1818;
    --danger-line: #5c2626;

    --focus: #60a5fa;
    --link: #93c5fd;
    --selection: rgba(96, 165, 250, 0.28);
    --scrollbar: #363b49;
    --scrollbar-track: transparent;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.45), 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.55), 0 6px 16px rgba(0, 0, 0, 0.4);
    --shadow-float: 0 10px 28px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }

  ::selection { background: var(--selection); color: var(--ink); }

  * { scrollbar-color: var(--scrollbar) var(--scrollbar-track); scrollbar-width: thin; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: var(--scrollbar-track); }
  *::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 8px; border: 2px solid var(--bg); background-clip: padding-box; }
  *::-webkit-scrollbar-thumb:hover { background: var(--line-strong); }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  html { background: var(--bg); }

  body {
    margin: 0;
    font: 13.5px/1.55 -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    font-feature-settings: "tnum" 1, "cv11" 1;
    background: var(--bg);
    color: var(--ink);
    transition: background 180ms ease, color 180ms ease;
  }

  svg.icon {
    width: 15px;
    height: 15px;
    flex: none;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---------------------------------- Header ---------------------------------- */

  header {
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  header .left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    background: var(--ink);
    display: grid;
    place-items: center;
    flex: none;
    box-shadow: var(--shadow-sm);
  }

  body.dark .brand-mark { background: var(--surface-hover); border: 1px solid var(--line-strong); }

  .brand-mark svg {
    width: 16px;
    height: 16px;
    stroke: var(--surface);
    fill: none;
    stroke-width: 1.8;
  }

  body.dark .brand-mark svg { stroke: var(--ink); }

  header h1 {
    font-size: 15px;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 0;
    white-space: nowrap;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 500;
    padding: 3px 9px 3px 7px;
    border-radius: 100px;
    background: var(--surface-sunken);
    border: 1px solid var(--line);
    white-space: nowrap;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--pass);
    box-shadow: 0 0 0 2.5px var(--pass-bg);
    flex: none;
  }

  .status-dot.error { background: var(--danger); box-shadow: 0 0 0 2.5px var(--danger-bg); }

  header .right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: none;
  }

  /* ---------------------------------- Controls ---------------------------------- */

  .segmented {
    display: flex;
    gap: 2px;
    border-radius: 8px;
    background: var(--surface-sunken);
    border: 1px solid var(--line);
    padding: 2px;
  }

  .segmented button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    border: none;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    font-weight: 560;
    cursor: pointer;
    border-radius: 6px;
    transition: background 120ms ease, color 120ms ease, box-shadow 120ms ease;
  }

  .segmented button.active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow-sm);
  }

  .segmented button:hover:not(.active) { color: var(--ink-soft); }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    border-radius: 8px;
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease, color 120ms ease, transform 120ms ease;
  }

  .icon-btn:hover { background: var(--surface-hover); border-color: var(--line-strong); color: var(--ink); }
  .icon-btn:active { transform: scale(0.94); }

  /* ---------------------------------- Tabs ---------------------------------- */

  .tabs {
    display: flex;
    gap: 2px;
    padding: 0 28px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    position: sticky;
    top: 57px;
    z-index: 19;
  }

  .tab-button {
    position: relative;
    padding: 11px 4px;
    margin-right: 22px;
    border: none;
    background: none;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    transition: color 120ms ease;
  }

  .tab-button::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 2px;
    border-radius: 2px 2px 0 0;
    background: transparent;
    transition: background 120ms ease;
  }

  .tab-button:hover { color: var(--ink-soft); }

  .tab-button.active { color: var(--ink); }
  .tab-button.active::after { background: var(--ink); }

  .tab-count {
    display: inline-block;
    margin-left: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    background: var(--surface-sunken);
    border-radius: 100px;
    padding: 1px 6px;
  }

  .tab-button.active .tab-count { color: var(--ink); background: var(--surface-sunken); }

  /* ---------------------------------- Layout ---------------------------------- */

  main {
    padding: 24px 28px 48px;
    min-height: calc(100vh - 150px);
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ---------------------------------- Pipeline ---------------------------------- */

  .pipeline-grid {
    display: grid;
    grid-template-columns: repeat(9, minmax(188px, 1fr));
    gap: 10px;
    align-items: start;
  }

  .pipeline-column {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }

  .column-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    padding: 7px 9px;
    border-radius: 7px;
    background: var(--surface-sunken);
  }

  .column-header.attention {
    color: var(--human);
    background: var(--human-bg);
  }

  .column-count {
    font-size: 10.5px;
    font-weight: 700;
    color: inherit;
    opacity: 0.75;
  }

  .column-empty {
    color: var(--muted);
    font-size: 11.5px;
    padding: 14px 6px;
    text-align: center;
    border: 1px dashed var(--line);
    border-radius: 8px;
  }

  /* ---------------------------------- Cards ---------------------------------- */

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 12px;
    cursor: pointer;
    transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    display: flex;
    flex-direction: column;
    gap: 7px;
    box-shadow: var(--shadow-sm);
  }

  .card:hover {
    border-color: var(--line-strong);
    box-shadow: var(--shadow-float);
    transform: translateY(-1px);
  }

  .card:active { transform: translateY(0); }

  .card.attention {
    border-color: var(--human-line);
    background: linear-gradient(180deg, var(--human-bg) 0%, var(--surface) 46%);
  }

  .card.attention:hover { box-shadow: var(--shadow-float), 0 0 0 1px var(--human-line); }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .card-id {
    font-size: 10.5px;
    color: var(--muted);
    font-weight: 600;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .human-flag {
    display: inline-flex;
    align-items: center;
    color: var(--human);
    flex: none;
  }

  .human-flag svg { width: 13px; height: 13px; }

  .card-title {
    font-weight: 620;
    font-size: 13px;
    line-height: 1.35;
    letter-spacing: -0.006em;
    color: var(--ink);
    margin: 0;
  }

  .card-path {
    font-size: 10.5px;
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-stage {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--surface-sunken);
    color: var(--ink-soft);
    font-size: 10.5px;
    padding: 2.5px 8px;
    border-radius: 100px;
    font-weight: 600;
    width: fit-content;
    border: 1px solid var(--line);
  }

  .card-round {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }

  .round-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    margin-right: 1px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 2px 7px;
    border-radius: 100px;
    font-size: 9.5px;
    font-weight: 650;
    letter-spacing: 0.01em;
    border: 1px solid transparent;
    background: var(--pending-bg);
    color: var(--pending);
    border-color: var(--pending-line);
  }

  .chip.PASS { background: var(--pass-bg); color: var(--pass); border-color: var(--pass-line); }
  .chip.CHANGES { background: var(--changes-bg); color: var(--changes); border-color: var(--changes-line); }
  .chip.N\/A { background: var(--na-bg); color: var(--na); border-color: var(--na-line); }
  .chip.ESCALATE, .chip.invalid { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-line); }
  .chip.pending { background: var(--pending-bg); color: var(--pending); border-color: var(--pending-line); }

  .card-warning {
    display: flex;
    gap: 6px;
    align-items: flex-start;
    color: var(--changes);
    font-size: 11px;
    line-height: 1.4;
    padding: 6px 8px;
    background: var(--changes-bg);
    border: 1px solid var(--changes-line);
    border-radius: 7px;
  }

  .card-warning svg { flex: none; margin-top: 1px; }

  /* ---------------------------------- Grouped view ---------------------------------- */

  .repo-group { margin-bottom: 28px; }

  .repo-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    margin: 0 0 12px;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--line);
  }

  .repo-header svg { color: var(--muted); }

  .jobs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
    gap: 14px;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 13px;
    padding: 64px 24px;
    text-align: center;
  }

  .empty-state svg { width: 32px; height: 32px; opacity: 0.5; }

  /* ---------------------------------- Modal ---------------------------------- */

  dialog {
    width: min(1180px, 94vw);
    height: min(88vh, 860px);
    border: none;
    border-radius: 14px;
    padding: 0;
    color: var(--ink);
    background: var(--surface);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }

  #archiveDialog {
    width: min(480px, 92vw);
    height: auto;
    max-height: 90vh;
    overflow: auto;
  }

  .archive-prompt {
    padding: 22px 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .archive-prompt-title {
    font-size: 16px;
    font-weight: 660;
    letter-spacing: -0.012em;
    color: var(--ink);
    margin: 0 0 2px;
  }

  .archive-prompt-title span {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-weight: 600;
    font-size: 0.85em;
    color: var(--muted);
  }

  .archive-prompt-copy {
    font-size: 13px;
    line-height: 1.55;
    color: var(--muted);
    margin: 0 0 14px;
  }

  .archive-prompt-copy code {
    font: 0.92em ui-monospace, "SF Mono", Menlo, monospace;
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    padding: 0.05em 0.35em;
    border-radius: 4px;
    color: var(--ink-soft);
  }

  .archive-prompt-label {
    font-size: 11px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .archive-prompt-input {
    font: 13px/1.5 -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    width: 100%;
    resize: vertical;
    min-height: 56px;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    margin-bottom: 16px;
  }

  .archive-prompt-input:focus-visible {
    border-color: var(--focus);
  }

  .archive-prompt-input::placeholder { color: var(--muted); }

  .archive-prompt-error {
    min-height: 1.2em;
    margin: -8px 0 12px;
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--danger);
  }

  .archive-prompt-actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
  }

  .archive-prompt-cancel {
    padding: 7px 16px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease;
  }

  .archive-prompt-cancel:hover { background: var(--surface-hover); border-color: var(--line-strong); }

  .modal-body {
    display: grid;
    grid-template-columns: 240px 1fr;
    height: calc(100% - 51px);
    min-height: 0;
  }

  dialog::backdrop {
    background: rgba(10, 11, 15, 0.55);
    backdrop-filter: blur(3px);
  }

  body.dark dialog::backdrop { background: rgba(0, 0, 0, 0.72); }

  dialog[open] {
    animation: modal-in 160ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes modal-in {
    from { opacity: 0; transform: translateY(6px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal-header {
    display: flex;
    gap: 10px;
    padding: 10px 14px 10px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    align-items: center;
    justify-content: space-between;
  }

  .modal-title {
    font-size: 12.5px;
    font-weight: 620;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .modal-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    border-radius: 8px;
    cursor: pointer;
    flex: none;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
  }

  .modal-close:hover { background: var(--surface-hover); color: var(--ink); border-color: var(--line-strong); }

  .modal-header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: none;
  }

  .archive-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 12px;
    border: 1px solid var(--line-strong);
    background: var(--ink);
    color: var(--surface);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 120ms ease, transform 120ms ease;
  }

  .archive-btn:hover { opacity: 0.85; }
  .archive-btn:active { transform: scale(0.97); }
  .archive-btn svg { width: 14px; height: 14px; }

  /* File sidebar: vertical list so every file is visible at once, however many
     rounds a job has accumulated, instead of a horizontal strip that hides most
     files behind scroll with no indication of what's off-screen. */
  .file-tabs {
    display: flex;
    flex-direction: column;
    gap: 1px;
    overflow-y: auto;
    padding: 8px;
    border-right: 1px solid var(--line);
    background: var(--surface-sunken);
    min-height: 0;
  }

  .file-tab {
    display: block;
    width: 100%;
    padding: 7px 10px;
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 7px;
    cursor: pointer;
    font: inherit;
    font-size: 11.5px;
    font-weight: 560;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    text-align: left;
    overflow-wrap: anywhere;
    line-height: 1.4;
    transition: background 120ms ease, color 120ms ease;
  }

  .file-tab:hover { background: var(--surface-hover); color: var(--ink-soft); }

  .file-tab.active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow-sm);
  }

  #content {
    padding: 22px 36px 32px;
    overflow: auto;
    min-height: 0;
    background: var(--surface);
  }

  /* ---------------------------------- Markdown ---------------------------------- */

  /* The modal is a reading surface (review findings, specs, rationale), not
     dashboard chrome — it gets its own, larger type scale independent of the
     compact 13.5px UI font-size used by cards and chips elsewhere. */
  .markdown {
    font-size: 15px;
    line-height: 1.7;
    color: var(--ink-soft);
    max-width: 78ch;
    letter-spacing: -0.001em;
  }

  /* Tables and code blocks carry structured/tabular content, not prose — let them
     use the wider content column instead of being squeezed to reading-line-length. */
  .markdown table, .markdown pre {
    max-width: none;
  }

  .markdown h1, .markdown h2, .markdown h3, .markdown h4, .markdown h5, .markdown h6 {
    margin: 1.5em 0 0.6em;
    line-height: 1.3;
    font-weight: 660;
    letter-spacing: -0.014em;
    color: var(--ink);
  }

  .markdown h1 { font-size: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .markdown h2 { font-size: 19px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .markdown h3 { font-size: 16.5px; }
  .markdown h4 { font-size: 15px; }

  .markdown > :first-child { margin-top: 0; }

  .markdown p, .markdown ul, .markdown ol, .markdown table, .markdown pre, .markdown blockquote {
    margin: 0 0 1.1em;
  }

  .markdown ul, .markdown ol { padding-left: 1.4em; }
  .markdown li > ul, .markdown li > ol { margin: 0.4em 0 0; }
  .markdown li { margin-bottom: 0.45em; }

  .markdown code {
    font: 0.9em/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    padding: 0.1em 0.4em;
    border-radius: 5px;
    color: var(--ink);
  }

  .markdown pre {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: 9px;
    padding: 15px 16px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.6;
  }

  .markdown pre code {
    background: none;
    border: none;
    padding: 0;
    color: var(--ink-soft);
    font: inherit;
    font-size: 1em;
  }

  .markdown blockquote {
    border-left: 3px solid var(--line-strong);
    color: var(--muted);
    padding: 2px 0 2px 16px;
    margin-left: 0;
    font-size: 0.97em;
  }

  .markdown table {
    border-collapse: separate;
    border-spacing: 0;
    display: block;
    overflow-x: auto;
    width: 100%;
    max-width: 100%;
    border: 1px solid var(--line);
    border-radius: 9px;
  }

  .markdown table > * { display: table; width: 100%; table-layout: fixed; }

  .markdown th, .markdown td {
    border-bottom: 1px solid var(--line);
    border-right: 1px solid var(--line);
    padding: 9px 12px;
    text-align: left;
    vertical-align: top;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink-soft);
    background: var(--surface);
    min-width: 0;
  }

  .markdown th:first-child, .markdown td:first-child { width: 32%; min-width: 180px; }

  .markdown th:last-child, .markdown td:last-child { border-right: none; }
  .markdown tbody tr:last-child td { border-bottom: none; }

  .markdown th {
    background: var(--surface-sunken);
    font-weight: 650;
    color: var(--ink);
  }

  .markdown code {
    overflow-wrap: anywhere;
    word-break: normal;
  }

  .markdown td code, .markdown th code {
    white-space: normal;
    overflow-wrap: anywhere;
  }

  .markdown hr { border: none; border-top: 1px solid var(--line); margin: 1.4em 0; }

  .markdown a { color: var(--link); text-decoration: none; text-underline-offset: 2px; }
  .markdown a:hover { text-decoration: underline; }

  .verdict {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 650;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 100px;
    margin-bottom: 18px;
    background: var(--pending-bg);
    color: var(--pending);
    border: 1px solid var(--pending-line);
  }

  .verdict.PASS { background: var(--pass-bg); color: var(--pass); border-color: var(--pass-line); }
  .verdict.CHANGES { background: var(--changes-bg); color: var(--changes); border-color: var(--changes-line); }
  .verdict.ESCALATE { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-line); }

  /* ---------------------------------- Responsive ---------------------------------- */

  @media (max-width: 1100px) {
    .pipeline-grid {
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    }
  }

  @media (max-width: 768px) {
    header { padding: 12px 16px; }
    .tabs { padding: 0 16px; top: 53px; }
    main { padding: 18px 16px 40px; }

    .pipeline-grid { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
    .jobs-grid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }

    dialog { width: 94vw; height: 86vh; }
    .modal-body { grid-template-columns: 180px 1fr; }
  }

  @media (max-width: 640px) {
    /* A fixed-width sidebar doesn't fit a phone screen: collapse the file list
       back into a horizontal scrolling strip above the content, stacked instead
       of side-by-side. */
    .modal-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }

    .file-tabs {
      flex-direction: row;
      overflow-x: auto;
      overflow-y: visible;
      border-right: none;
      border-bottom: 1px solid var(--line);
      padding: 6px 8px;
      scrollbar-width: none;
    }

    .file-tabs::-webkit-scrollbar { display: none; }

    .file-tab { white-space: nowrap; width: auto; }
  }

  @media (max-width: 560px) {
    header h1 { display: none; }
    header .status-pill span.status-text { display: none; }

    .tab-button { margin-right: 16px; }

    main { padding: 14px 12px 32px; }
    .pipeline-grid { grid-template-columns: 1fr 1fr; }
    .jobs-grid { grid-template-columns: 1fr; }

    dialog { width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; }
    #content { padding: 18px 16px 28px; }
    .modal-title { font-size: 11.5px; }

    .markdown th:first-child, .markdown td:first-child { width: 42%; min-width: 0; }
  }
</style>
</head>
<body>

<header>
  <div class="left">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M3 21V10l6-3 6 3 6-3v11l-6 3-6-3-6 3Z"/><path d="M9 7v11"/><path d="M15 10v11"/></svg>
    </div>
    <h1>Engineering&nbsp;Guard Factory</h1>
    <span class="status-pill"><span class="status-dot" id="statusDot"></span><span class="status-text" id="status">Loading…</span></span>
  </div>
  <div class="right">
    <div class="segmented" role="tablist" aria-label="View">
      <button class="active" onclick="switchView('pipeline')" id="viewPipelineBtn">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="5" height="7" rx="1"/></svg>
        Pipeline
      </button>
      <button onclick="switchView('grouped')" id="viewGroupedBtn">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
        Grouped
      </button>
    </div>
    <button class="icon-btn" onclick="toggleDarkMode()" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="icon" viewBox="0 0 24 24" id="themeIconSun" style="display:none"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>
      <svg class="icon" viewBox="0 0 24 24" id="themeIconMoon"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
    </button>
  </div>
</header>

<div class="tabs">
  <button class="tab-button active" onclick="switchTab('in-progress')" id="tabInProgress">In Progress<span class="tab-count" id="countInProgress">0</span></button>
  <button class="tab-button" onclick="switchTab('archive')" id="tabArchive">Archive<span class="tab-count" id="countArchive">0</span></button>
</div>

<main>
  <div id="in-progress" class="tab-content active">
    <div id="pipeline-view" class="pipeline-grid"></div>
    <div id="grouped-view" style="display: none;"></div>
  </div>
  <div id="archive" class="tab-content"></div>
</main>

<dialog id="viewer">
  <div class="modal-header">
    <span class="modal-title" id="modalTitle"></span>
    <div class="modal-header-actions">
      <button class="archive-btn" id="archiveBtn" onclick="openArchivePrompt()" style="display: none;">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M6 7v12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M10 11v5M14 11v5"/></svg>
        Archive job
      </button>
      <button class="modal-close" onclick="closeViewer()" aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <div class="modal-body">
    <nav class="file-tabs" id="fileTabs" aria-label="Job files"></nav>
    <div id="content" class="markdown"></div>
  </div>
</dialog>

<dialog id="archiveDialog">
  <form class="archive-prompt" onsubmit="event.preventDefault(); archiveCurrentJob();">
    <h2 class="archive-prompt-title">Archive <span id="archiveJobId"></span></h2>
    <p class="archive-prompt-copy">
      Archiving closes an approved job and moves it to the Archive tab. The
      reason is recorded in the job history; code changes in the worktree are
      left untouched.
    </p>
    <label class="archive-prompt-label" for="archiveReason">Reason</label>
    <textarea id="archiveReason" class="archive-prompt-input" rows="2" placeholder="e.g. approved: branch, commit message and PR description generated"></textarea>
    <p class="archive-prompt-error" id="archiveError" role="alert"></p>
    <div class="archive-prompt-actions">
      <button type="button" class="archive-prompt-cancel" onclick="closeArchivePrompt()">Cancel</button>
      <button type="submit" class="archive-btn" id="archiveSubmitBtn">Archive job</button>
    </div>
  </form>
</dialog>

<script>
const STAGES = [
  ["spec", "Spec"], ["spec-review", "Spec Review"],
  ["build", "Build"], ["test-audit", "Test Audit"],
  ["review", "Review"], ["stride-review", "STRIDE"],
  ["approver", "Approver"], ["needs-human", "Needs Human"],
  ["abandoned", "Abandoned"],
];

const HUMAN_STAGES = new Set(["spec-review", "needs-human"]);
const REVIEWERS = ["security", "ux", "ui", "code"];

const ICON_WARNING = '<svg class="icon" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="M12 3.5 2.5 20h19L12 3.5Z"/><path d="M12 10v4.2"/><circle cx="12" cy="17.3" r="0.4" fill="currentColor" stroke="none"/></svg>';
const ICON_FLAG = '<svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 5h13l-3 4 3 4H5"/></svg>';
const ICON_REPO = '<svg class="icon" viewBox="0 0 24 24"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H16l4 4v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 20V4.5Z"/><path d="M16 3v4h4"/></svg>';
const ICON_EMPTY = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7"/></svg>';

let currentTab = "in-progress";
let currentView = "pipeline";
let currentJobFiles = {};
let lastInProgress = [];
let lastArchived = [];

/* ---------------------------------- Theme ---------------------------------- */

function applyTheme(isDark) {
  document.body.classList.toggle("dark", isDark);
  document.getElementById("themeIconSun").style.display = isDark ? "block" : "none";
  document.getElementById("themeIconMoon").style.display = isDark ? "none" : "block";
}

function initDarkMode() {
  const saved = localStorage.getItem("eg-dark-mode");
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(saved ? saved === "true" : prefersDark);
}

function toggleDarkMode() {
  const isDark = !document.body.classList.contains("dark");
  applyTheme(isDark);
  localStorage.setItem("eg-dark-mode", String(isDark));
}

/* ---------------------------------- Navigation ---------------------------------- */

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".tab-button").forEach(el => el.classList.remove("active"));
  document.getElementById(tab).classList.add("active");
  document.getElementById(tab === "in-progress" ? "tabInProgress" : "tabArchive").classList.add("active");
  renderCurrent();
}

function switchView(view) {
  currentView = view;
  document.getElementById("viewPipelineBtn").classList.toggle("active", view === "pipeline");
  document.getElementById("viewGroupedBtn").classList.toggle("active", view === "grouped");

  if (currentTab === "in-progress") {
    document.getElementById("pipeline-view").style.display = view === "pipeline" ? "grid" : "none";
    document.getElementById("grouped-view").style.display = view === "grouped" ? "block" : "none";
  }
  renderCurrent();
}

function renderCurrent() {
  if (currentTab === "in-progress") {
    if (currentView === "pipeline") renderPipeline(lastInProgress);
    else renderGrouped(lastInProgress, "grouped-view");
  } else {
    renderGrouped(lastArchived, "archive");
  }
}

/* ---------------------------------- Rendering ---------------------------------- */

function chip(name, verdict) {
  return `<span class="chip ${verdict}" title="${name}: ${verdict}">${name}</span>`;
}

function roundRow(label, testAudit, reviews) {
  let html = `<div class="card-round">`;
  if (label) html += `<span class="round-label">${label}</span>`;
  if (testAudit) html += chip("tests", testAudit);
  if (reviews && Object.keys(reviews).length) {
    for (const reviewer of REVIEWERS) {
      const verdict = reviews[reviewer] || "pending";
      html += chip(reviewer, verdict);
    }
  }
  html += `</div>`;
  return html;
}

function renderCard(job) {
  const isWaitingOnHuman = HUMAN_STAGES.has(job.stage);
  const cardClass = isWaitingOnHuman ? "card attention" : "card";

  let html = `<div class="${cardClass}" onclick="openJob(${JSON.stringify(job).replace(/"/g, '&quot;')})">
    <div class="card-top">
      <div class="card-id">${escapeHtml(job.id)}</div>
      ${isWaitingOnHuman ? `<span class="human-flag" title="Needs human decision">${ICON_FLAG}</span>` : ""}
    </div>
    <div class="card-title">${escapeHtml(job.title)}</div>`;

  if (job.repo_path || job.worktree_path) {
    html += `<div class="card-path">${escapeHtml(job.repo_path || job.worktree_path)}</div>`;
  }

  html += `<div class="card-stage">${escapeHtml(job.stage)}</div>`;

  if (job.round && (job.test_audit || (job.reviews && Object.keys(job.reviews).length))) {
    if (job.test_audit) {
      html += roundRow(`R${job.round}`, job.test_audit, {});
    }
    if (job.reviews && Object.keys(job.reviews).length) {
      html += roundRow(job.test_audit ? "" : `R${job.round}`, null, job.reviews);
    }
  }

  if (job.stride) {
    html += `<div class="card-round"><span class="round-label">STRIDE</span>${chip("stride", job.stride)}</div>`;
  }

  if (job.warnings && job.warnings.length) {
    for (const warn of job.warnings) {
      html += `<div class="card-warning">${ICON_WARNING}<span>${escapeHtml(warn)}</span></div>`;
    }
  }

  html += `</div>`;
  return html;
}

function renderPipeline(jobs) {
  const container = document.getElementById("pipeline-view");
  let html = "";
  const knownStages = new Set(STAGES.map(([key]) => key));

  for (const [stageKey, stageName] of STAGES) {
    const stageJobs = jobs.filter(j => j.stage === stageKey);
    const isAttention = HUMAN_STAGES.has(stageKey) && stageJobs.length > 0;

    html += `<div class="pipeline-column">
      <div class="column-header ${isAttention ? "attention" : ""}">
        <span>${stageName}</span>
        <span class="column-count">${stageJobs.length}</span>
      </div>`;

    if (stageJobs.length === 0) {
      html += `<div class="column-empty">—</div>`;
    } else {
      for (const job of stageJobs) {
        html += renderCard(job);
      }
    }

    html += `</div>`;
  }

  // Surface jobs whose stage isn't in STAGES instead of silently dropping them —
  // this list is a hand-maintained copy of the pipeline stages factory_board.py
  // can produce, and a stage added on the Python side without updating STAGES
  // here would otherwise hide that job from the dashboard entirely.
  const unknownJobs = jobs.filter(j => !knownStages.has(j.stage));
  if (unknownJobs.length) {
    html += `<div class="pipeline-column">
      <div class="column-header attention">
        <span>Unknown Stage</span>
        <span class="column-count">${unknownJobs.length}</span>
      </div>`;
    for (const job of unknownJobs) {
      html += renderCard(job);
    }
    html += `</div>`;
  }

  container.innerHTML = html;
}

function renderGrouped(jobs, containerId) {
  const container = document.getElementById(containerId);

  if (!jobs || jobs.length === 0) {
    container.innerHTML = `<div class="empty-state">${ICON_EMPTY}<span>No jobs to show</span></div>`;
    return;
  }

  const byRepo = {};
  for (const job of jobs) {
    const repoName = job.repository || "Unknown";
    if (!byRepo[repoName]) byRepo[repoName] = [];
    byRepo[repoName].push(job);
  }

  let html = "";
  for (const [repo, repoJobs] of Object.entries(byRepo).sort()) {
    html += `<div class="repo-group">
      <div class="repo-header">${ICON_REPO}${escapeHtml(repo)}</div>
      <div class="jobs-grid">`;

    for (const job of repoJobs) {
      html += renderCard(job);
    }

    html += `</div></div>`;
  }

  container.innerHTML = html;
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text == null ? "" : String(text);
  return div.innerHTML;
}

/* ---------------------------------- Modal ---------------------------------- */

// job.files has two possible shapes depending on data source:
//  - central server (dataSource === "api"): an object of {filename: content},
//    content already inlined by factory_board.py's _push_to_central_server.
//  - per-repository board.json (dataSource === "board"): a plain array of
//    filenames with no content; each file is fetched on demand from the
//    static server at jobs/{id}/{file}, matching the pre-existing .factory/
//    directory layout.
let currentJobId = null;
let currentJob = null;

function openJob(job) {
  currentJobId = job.id;
  currentJob = job;
  const files = job.files;
  const fileNames = Array.isArray(files) ? files : Object.keys(files || {});
  currentJobFiles = Array.isArray(files) ? {} : (files || {});

  document.getElementById("modalTitle").textContent = `${job.id} — ${job.title}`;

  // Archiving is a write, and only the central server has a backend for it.
  // In board.json mode the dashboard is served by a plain static server, so
  // hide the action instead of offering something that cannot work.
  const archiveBtn = document.getElementById("archiveBtn");
  archiveBtn.style.display = job.stage === "needs-human" && dataSource === "api" ? "inline-flex" : "none";

  if (!fileNames.length) {
    alert("No files available for this job");
    return;
  }

  let tabsHtml = "";
  for (let i = 0; i < fileNames.length; i++) {
    const name = fileNames[i];
    const className = i === 0 ? "file-tab active" : "file-tab";
    tabsHtml += `<button class="${className}" data-file="${escapeHtml(name)}">${escapeHtml(name)}</button>`;
  }

  const fileTabsEl = document.getElementById("fileTabs");
  fileTabsEl.innerHTML = tabsHtml;
  fileTabsEl.querySelectorAll(".file-tab").forEach(btn => {
    btn.addEventListener("click", () => selectFile(btn.dataset.file));
  });

  selectFile(fileNames[0]);
  document.getElementById("viewer").showModal();
}

async function selectFile(fileName) {
  document.querySelectorAll(".file-tab").forEach(tab => {
    tab.classList.toggle("active", tab.dataset.file === fileName);
  });

  if (Object.prototype.hasOwnProperty.call(currentJobFiles, fileName)) {
    document.getElementById("content").innerHTML = renderJobFile(currentJobFiles[fileName]);
    return;
  }

  // Per-repository mode: content isn't inlined, fetch it lazily and cache it.
  document.getElementById("content").innerHTML = `<div class="markdown"><p>Loading…</p></div>`;
  try {
    const response = await fetch(`jobs/${encodeURIComponent(currentJobId)}/${fileName}`, { cache: "no-store" });
    const content = response.ok ? await response.text() : "File not found";
    currentJobFiles[fileName] = content;
    document.getElementById("content").innerHTML = renderJobFile(content);
  } catch (error) {
    document.getElementById("content").innerHTML = `<div class="markdown"><p>Failed to load file.</p></div>`;
  }
}

function closeViewer() {
  document.getElementById("viewer").close();
}

/* ---------------------------------- Archive prompt ---------------------------------- */

function openArchivePrompt() {
  if (!currentJob) return;
  if (dataSource !== "api") {
    alert("Archiving from the dashboard needs the central server. Start it with /factory-server start.");
    return;
  }
  document.getElementById("archiveJobId").textContent = currentJob.id;
  document.getElementById("archiveReason").value = "";
  document.getElementById("archiveError").textContent = "";
  document.getElementById("archiveDialog").showModal();
  document.getElementById("archiveReason").focus();
}

function closeArchivePrompt() {
  document.getElementById("archiveDialog").close();
}

async function archiveCurrentJob() {
  if (!currentJob) return;
  const error = document.getElementById("archiveError");
  const submit = document.getElementById("archiveSubmitBtn");
  const reason = document.getElementById("archiveReason").value.trim();
  error.textContent = "";
  submit.disabled = true;
  try {
    const response = await fetch("/api/jobs/archive", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        id: currentJob.id,
        repo_path: currentJob.repo_path,
        reason: reason || "approved",
      }),
    });
    if (!response.ok) {
      let detail = `HTTP ${response.status}`;
      try {
        detail = (await response.json()).error || detail;
      } catch (ignored) {}
      throw new Error(detail);
    }
    closeArchivePrompt();
    closeViewer();
    await pollJobs();
  } catch (err) {
    error.textContent = `Could not archive: ${err.message}`;
  } finally {
    submit.disabled = false;
  }
}

/* ---------------------------------- Markdown ---------------------------------- */

function escapeCode(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function safeUrl(url) {
  return /^(https?:|mailto:|#|\.{0,2}\/|[\w-]+(\.[\w-]+)*(\/|$))/i.test(url) && !/^\s*javascript:/i.test(url) ? url : "#";
}

function renderInline(text) {
  const codeSpans = [];
  let html = escapeCode(text).replace(/`([^`]+)`/g, (_, code) => {
    codeSpans.push(`<code>${code}</code>`);
    return `\u0000${codeSpans.length - 1}\u0000`;
  });
  html = html
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, url) =>
      `<a href="${safeUrl(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/__([^_]+)__/g, "<strong>$1</strong>")
    .replace(/(^|[^\w*])\*([^*\s][^*]*)\*(?!\w)/g, "$1<em>$2</em>")
    .replace(/(^|[^\w])_([^_\s][^_]*)_(?!\w)/g, "$1<em>$2</em>");
  return html.replace(/\u0000(\d+)\u0000/g, (_, index) => codeSpans[Number(index)]);
}

const LIST_ITEM = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const TABLE_SEPARATOR = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
const BLOCK_START = /^(\s*```|#{1,6}\s|>|\s*([-*+]|\d+[.)])\s|(-{3,}|\*{3,}|_{3,})\s*$)/;

function tableCells(line) {
  return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim());
}

function renderList(lines) {
  const ordered = /^\s*\d/.test(lines[0]);
  const baseIndent = lines[0].match(/^\s*/)[0].length;
  const items = [];
  for (const line of lines) {
    const match = line.match(LIST_ITEM);
    if (match && match[1].length <= baseIndent) items.push([match[3]]);
    else if (items.length) items[items.length - 1].push(line.slice(Math.min(baseIndent + 2, line.match(/^\s*/)[0].length)));
  }
  const body = items.map(([first, ...rest]) => {
    const task = first.match(/^\[([ xX])\]\s+(.*)$/);
    const label = task
      ? `<input type="checkbox" disabled${task[1] === " " ? "" : " checked"}> ${renderInline(task[2])}`
      : renderInline(first);
    const nested = rest.some(line => line.trim()) ? renderMarkdown(rest.join("\n")) : "";
    return `<li${task ? ' class="task"' : ""}>${label}${nested}</li>`;
  }).join("");
  return ordered ? `<ol>${body}</ol>` : `<ul>${body}</ul>`;
}

function renderMarkdown(source) {
  const lines = source.replace(/\r\n?/g, "\n").split("\n");
  const html = [];
  let index = 0;
  while (index < lines.length) {
    const line = lines[index];
    if (!line.trim()) { index++; continue; }

    const fence = line.match(/^\s*```/);
    if (fence) {
      const code = [];
      index++;
      while (index < lines.length && !/^\s*```/.test(lines[index])) code.push(lines[index++]);
      index++;
      html.push(`<pre><code>${escapeCode(code.join("\n"))}</code></pre>`);
      continue;
    }

    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    if (heading) {
      const level = heading[1].length;
      html.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);
      index++;
      continue;
    }

    if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { html.push("<hr>"); index++; continue; }

    if (line.includes("|") && TABLE_SEPARATOR.test(lines[index + 1] || "")) {
      const header = tableCells(line).map(cell => `<th>${renderInline(cell)}</th>`).join("");
      const rows = [];
      index += 2;
      while (index < lines.length && lines[index].includes("|") && lines[index].trim()) {
        rows.push("<tr>" + tableCells(lines[index++]).map(cell => `<td>${renderInline(cell)}</td>`).join("") + "</tr>");
      }
      html.push(`<table><thead><tr>${header}</tr></thead><tbody>${rows.join("")}</tbody></table>`);
      continue;
    }

    if (/^\s*>/.test(line)) {
      const quoted = [];
      while (index < lines.length && /^\s*>/.test(lines[index])) quoted.push(lines[index++].replace(/^\s*>\s?/, ""));
      html.push(`<blockquote>${renderMarkdown(quoted.join("\n"))}</blockquote>`);
      continue;
    }

    if (LIST_ITEM.test(line)) {
      const block = [];
      while (index < lines.length) {
        const current = lines[index];
        if (LIST_ITEM.test(current) || (/^\s{2,}\S/.test(current) && block.length)) { block.push(current); index++; }
        else if (!current.trim() && LIST_ITEM.test(lines[index + 1] || "")) { index++; }
        else break;
      }
      html.push(renderList(block));
      continue;
    }

    const paragraph = [];
    while (index < lines.length && lines[index].trim() && !(paragraph.length && BLOCK_START.test(lines[index]))) {
      paragraph.push(lines[index++].trim());
    }
    html.push(`<p>${paragraph.map(renderInline).join("<br>")}</p>`);
  }
  return html.join("\n");
}

function renderJobFile(text) {
  const firstLine = (text.match(/^\s*(.*)/) || ["", ""])[1].trim();
  const verdict = firstLine.match(/^VERDICT:\s*(PASS|CHANGES|N\/A)$/) || firstLine.match(/^(ESCALATE)\b/);
  if (!verdict) return `<div class="markdown">${renderMarkdown(text)}</div>`;
  const rest = text.replace(/^\s*.*\n?/, "");
  return `<span class="verdict ${verdict[1]}">${escapeHtml(firstLine)}</span><div class="markdown">${renderMarkdown(rest)}</div>`;
}

/* ---------------------------------- Data polling ---------------------------------- */

// Two hosting modes are supported:
//  - Central server (central_factory_server.py): GET /api/jobs returns in-progress
//    jobs only; completed jobs are moved server-side into GET /api/jobs/archive.
//  - Per-repository static server (python3 -m http.server -d .factory): there is no
//    backend, so job state is read directly from the flat board.json file instead,
//    and in-progress/archived is derived client-side from each job's stage.
// dataSource caches which mode worked so we don't retry the other mode's failing
// endpoint every single poll tick.
let dataSource = null;

async function fetchViaApi() {
  const [jobsRes, archiveRes] = await Promise.all([
    fetch("/api/jobs", { cache: "no-store" }),
    fetch("/api/jobs/archive", { cache: "no-store" }),
  ]);
  if (!jobsRes.ok) throw new Error(`HTTP ${jobsRes.status}`);
  const jobsData = await jobsRes.json();
  const archiveData = archiveRes.ok ? await archiveRes.json() : { jobs: [] };
  return {
    inProgress: jobsData.jobs || [],
    archived: archiveData.jobs || [],
  };
}

async function fetchViaBoardFile() {
  const response = await fetch("board.json", { cache: "no-store" });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const data = await response.json();
  const allJobs = data.jobs || [];
  return {
    inProgress: allJobs.filter(j => j.stage !== "abandoned"),
    archived: allJobs.filter(j => j.stage === "abandoned"),
  };
}

async function fetchJobs() {
  if (dataSource === "api") return fetchViaApi();
  if (dataSource === "board") return fetchViaBoardFile();

  // Mode not yet determined: try the central-server API first, then fall back
  // to the flat board.json file used by the per-repository static server.
  try {
    const result = await fetchViaApi();
    dataSource = "api";
    return result;
  } catch (apiError) {
    const result = await fetchViaBoardFile();
    dataSource = "board";
    return result;
  }
}

async function pollJobs() {
  const status = document.getElementById("status");
  const dot = document.getElementById("statusDot");
  try {
    const { inProgress, archived } = await fetchJobs();

    lastInProgress = inProgress;
    lastArchived = archived;
    renderCurrent();

    document.getElementById("countInProgress").textContent = inProgress.length;
    document.getElementById("countArchive").textContent = archived.length;

    const count = inProgress.length + archived.length;
    const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    status.textContent = count === 0 ? "No active jobs" : `${count} job${count === 1 ? "" : "s"} · ${time}`;
    dot.classList.remove("error");
  } catch (error) {
    dataSource = null; // re-probe both modes next tick in case the server came back
    status.textContent = "Connection lost";
    dot.classList.add("error");
  }
}

document.getElementById("viewer").addEventListener("click", event => {
  if (event.target.id === "viewer") event.target.close();
});

document.getElementById("archiveDialog").addEventListener("click", event => {
  if (event.target.id === "archiveDialog") event.target.close();
});

initDarkMode();
pollJobs();
setInterval(pollJobs, 2000);
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineering Guard Factory</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#6b7280; --line:#e3e6eb;
          --pass:#1f9d55; --changes:#d97706; --pending:#c4c9d2; --na:#9ca3af; --human:#7c3aed; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:16px 24px; display:flex; align-items:baseline; gap:12px; }
  header h1 { font-size:18px; margin:0; }
  header span { color:var(--muted); font-size:12px; }
  main { display:grid; grid-template-columns:repeat(7, minmax(160px,1fr)); gap:12px; padding:0 24px 24px; }
  .column h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; }
  .column.attention h2 { color:var(--human); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px; cursor:pointer; }
  .card:hover { border-color:#b9c0cc; }
  .card.attention { border:2px solid var(--human); box-shadow:0 0 0 3px #ede4ff; }
  .card .id { font-size:11px; color:var(--muted); }
  .card .title { font-weight:600; margin:2px 0 6px; }
  .round { display:flex; align-items:center; gap:4px; font-size:11px; color:var(--muted); margin-top:4px; }
  .chip { padding:1px 6px; border-radius:10px; color:#fff; font-size:10px; background:var(--pending); }
  .chip.PASS { background:var(--pass); } .chip.CHANGES { background:var(--changes); }
  .chip.N\/A { background:var(--na); } .chip.invalid { background:#dc2626; }
  .warn { color:#b45309; font-size:11px; margin-top:6px; }
  dialog { width:min(900px,92vw); height:85vh; border:none; border-radius:10px; padding:0; }
  dialog .bar { display:flex; gap:6px; flex-wrap:wrap; padding:10px; border-bottom:1px solid var(--line); }
  dialog button { border:1px solid var(--line); background:#fff; border-radius:6px; padding:4px 8px; cursor:pointer; font-size:12px; }
  dialog button.active { background:var(--ink); color:#fff; }
  #content { padding:16px 24px; overflow:auto; height:calc(85vh - 52px); }
  .markdown { line-height:1.6; }
  .markdown h1, .markdown h2, .markdown h3, .markdown h4 { margin:1.2em 0 .5em; line-height:1.3; }
  .markdown h1 { font-size:20px; } .markdown h2 { font-size:17px; border-bottom:1px solid var(--line); padding-bottom:4px; }
  .markdown h3 { font-size:15px; } .markdown h4 { font-size:14px; }
  .markdown > :first-child { margin-top:0; }
  .markdown p, .markdown ul, .markdown ol, .markdown table, .markdown pre, .markdown blockquote { margin:0 0 .8em; }
  .markdown ul, .markdown ol { padding-left:1.4em; }
  .markdown li > ul, .markdown li > ol { margin:0; }
  .markdown li.task { list-style:none; margin-left:-1.2em; }
  .markdown code { font:12.5px ui-monospace, monospace; background:#f1f3f5; padding:1px 4px; border-radius:4px; }
  .markdown pre { background:#f6f8fa; border:1px solid var(--line); border-radius:6px; padding:10px 12px; overflow:auto; }
  .markdown pre code { background:none; padding:0; }
  .markdown blockquote { border-left:3px solid var(--line); color:var(--muted); padding-left:12px; margin-left:0; }
  .markdown table { border-collapse:collapse; display:block; overflow:auto; }
  .markdown th, .markdown td { border:1px solid var(--line); padding:4px 8px; text-align:left; vertical-align:top; }
  .markdown th { background:#f6f8fa; }
  .markdown hr { border:none; border-top:1px solid var(--line); margin:1em 0; }
  .markdown a { color:#2563eb; }
  .verdict { display:inline-block; font-weight:600; font-size:12px; padding:3px 10px; border-radius:12px; color:#fff; margin-bottom:12px; background:var(--na); }
  .verdict.PASS { background:var(--pass); } .verdict.CHANGES { background:var(--changes); } .verdict.ESCALATE { background:var(--human); }
  .empty { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header><h1>Engineering Guard Factory</h1><span id="status">loading…</span></header>
<main id="board"></main>
<dialog id="viewer"><div class="bar" id="tabs"></div><div id="content" class="markdown"></div></dialog>
<script>
// Columns mirror the factory loop; spec-review and needs-human wait on a human.
const STAGES = [
  ["spec", "Spec"], ["spec-review", "Spec review (human)"], ["build", "Build"],
  ["test-audit", "Test audit"], ["review", "Review"], ["approver", "Approver"], ["needs-human", "Needs human"],
  ["abandoned", "Abandoned"],
];
const HUMAN_STAGES = new Set(["spec-review", "needs-human"]);
const REVIEWERS = ["security", "ux", "ui", "code"];

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function chip(name, verdict) {
  const node = element("span", "chip " + verdict, name);
  node.title = name + ": " + verdict;
  return node;
}

// A round shows the test-audit chip, then reviewer chips once reviews started.
function roundRow(label, testAudit, reviews) {
  const row = element("div", "round", label);
  if (testAudit) row.append(chip("tests", testAudit));
  if (!reviews || !Object.keys(reviews).length) return row;
  for (const reviewer of REVIEWERS) {
    const verdict = reviews[reviewer] || "pending";
    row.append(chip(reviewer, verdict));
  }
  return row;
}

function renderCard(job) {
  const card = element("div", "card" + (HUMAN_STAGES.has(job.stage) ? " attention" : ""));
  card.append(element("div", "id", job.id), element("div", "title", job.title));
  for (const past of job.history || []) card.append(roundRow("R" + past.round, past.test_audit, past.reviews));
  if (job.stage === "test-audit" || job.stage === "review") {
    card.append(roundRow("R" + job.round, job.test_audit, job.reviews));
  }
  for (const warning of job.warnings || []) card.append(element("div", "warn", warning));
  card.onclick = () => openJob(job);
  return card;
}

function render(board) {
  const root = document.getElementById("board");
  root.replaceChildren();
  for (const [stage, label] of STAGES) {
    const jobs = board.jobs.filter(job => job.stage === stage);
    const column = element("section", "column" + (HUMAN_STAGES.has(stage) && jobs.length ? " attention" : ""));
    column.append(element("h2", "", `${label} (${jobs.length})`));
    if (!jobs.length) column.append(element("div", "empty", "—"));
    jobs.forEach(job => column.append(renderCard(job)));
    root.append(column);
  }
}

// Minimal Markdown renderer kept inline so the dashboard stays one dependency-free
// file. Job files are written by agents, so all text is HTML-escaped before any
// markup is added, and links are restricted to safe URL schemes.
function escapeHtml(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function safeUrl(url) {
  return /^(https?:|mailto:|#|\.{0,2}\/|[\w-]+(\.[\w-]+)*(\/|$))/i.test(url) && !/^\s*javascript:/i.test(url) ? url : "#";
}

function renderInline(text) {
  const codeSpans = [];
  let html = escapeHtml(text).replace(/`([^`]+)`/g, (_, code) => {
    codeSpans.push(`<code>${code}</code>`);
    return `\u0000${codeSpans.length - 1}\u0000`;
  });
  html = html
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, url) =>
      `<a href="${safeUrl(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/__([^_]+)__/g, "<strong>$1</strong>")
    .replace(/(^|[^\w*])\*([^*\s][^*]*)\*(?!\w)/g, "$1<em>$2</em>")
    .replace(/(^|[^\w])_([^_\s][^_]*)_(?!\w)/g, "$1<em>$2</em>");
  return html.replace(/\u0000(\d+)\u0000/g, (_, index) => codeSpans[Number(index)]);
}

const LIST_ITEM = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const TABLE_SEPARATOR = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
const BLOCK_START = /^(\s*```|#{1,6}\s|>|\s*([-*+]|\d+[.)])\s|(-{3,}|\*{3,}|_{3,})\s*$)/;

function tableCells(line) {
  return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim());
}

function renderList(lines) {
  const ordered = /^\s*\d/.test(lines[0]);
  const baseIndent = lines[0].match(/^\s*/)[0].length;
  const items = [];
  for (const line of lines) {
    const match = line.match(LIST_ITEM);
    if (match && match[1].length <= baseIndent) items.push([match[3]]);
    else if (items.length) items[items.length - 1].push(line.slice(Math.min(baseIndent + 2, line.match(/^\s*/)[0].length)));
  }
  const body = items.map(([first, ...rest]) => {
    const task = first.match(/^\[([ xX])\]\s+(.*)$/);
    const label = task
      ? `<input type="checkbox" disabled${task[1] === " " ? "" : " checked"}> ${renderInline(task[2])}`
      : renderInline(first);
    const nested = rest.some(line => line.trim()) ? renderMarkdown(rest.join("\n")) : "";
    return `<li${task ? ' class="task"' : ""}>${label}${nested}</li>`;
  }).join("");
  return ordered ? `<ol>${body}</ol>` : `<ul>${body}</ul>`;
}

function renderMarkdown(source) {
  const lines = source.replace(/\r\n?/g, "\n").split("\n");
  const html = [];
  let index = 0;
  while (index < lines.length) {
    const line = lines[index];
    if (!line.trim()) { index++; continue; }

    const fence = line.match(/^\s*```/);
    if (fence) {
      const code = [];
      index++;
      while (index < lines.length && !/^\s*```/.test(lines[index])) code.push(lines[index++]);
      index++;
      html.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`);
      continue;
    }

    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    if (heading) {
      const level = heading[1].length;
      html.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);
      index++;
      continue;
    }

    if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { html.push("<hr>"); index++; continue; }

    if (line.includes("|") && TABLE_SEPARATOR.test(lines[index + 1] || "")) {
      const header = tableCells(line).map(cell => `<th>${renderInline(cell)}</th>`).join("");
      const rows = [];
      index += 2;
      while (index < lines.length && lines[index].includes("|") && lines[index].trim()) {
        rows.push("<tr>" + tableCells(lines[index++]).map(cell => `<td>${renderInline(cell)}</td>`).join("") + "</tr>");
      }
      html.push(`<table><thead><tr>${header}</tr></thead><tbody>${rows.join("")}</tbody></table>`);
      continue;
    }

    if (/^\s*>/.test(line)) {
      const quoted = [];
      while (index < lines.length && /^\s*>/.test(lines[index])) quoted.push(lines[index++].replace(/^\s*>\s?/, ""));
      html.push(`<blockquote>${renderMarkdown(quoted.join("\n"))}</blockquote>`);
      continue;
    }

    if (LIST_ITEM.test(line)) {
      // A list continues through indented lines and single blank lines between items.
      const block = [];
      while (index < lines.length) {
        const current = lines[index];
        if (LIST_ITEM.test(current) || (/^\s{2,}\S/.test(current) && block.length)) { block.push(current); index++; }
        else if (!current.trim() && LIST_ITEM.test(lines[index + 1] || "")) { index++; }
        else break;
      }
      html.push(renderList(block));
      continue;
    }

    const paragraph = [];
    while (index < lines.length && lines[index].trim() && !(paragraph.length && BLOCK_START.test(lines[index]))) {
      paragraph.push(lines[index++].trim());
    }
    html.push(`<p>${paragraph.map(renderInline).join("<br>")}</p>`);
  }
  return html.join("\n");
}

// Factory files open with a verdict line; show it as a badge instead of plain text.
function renderJobFile(text) {
  const firstLine = (text.match(/^\s*(.*)/) || ["", ""])[1].trim();
  const verdict = firstLine.match(/^VERDICT:\s*(PASS|CHANGES|N\/A)$/) || firstLine.match(/^(ESCALATE)\b/);
  if (!verdict) return renderMarkdown(text);
  const rest = text.replace(/^\s*.*\n?/, "");
  return `<span class="verdict ${verdict[1]}">${escapeHtml(firstLine)}</span>` + renderMarkdown(rest);
}

async function openJob(job) {
  const tabs = document.getElementById("tabs");
  const content = document.getElementById("content");
  tabs.replaceChildren();
  content.textContent = job.files && job.files.length ? "" : "No files yet.";
  for (const file of job.files || []) {
    const button = element("button", "", file);
    button.onclick = async () => {
      tabs.querySelectorAll("button").forEach(other => other.classList.remove("active"));
      button.classList.add("active");
      const response = await fetch(`jobs/${job.id}/${file}`, { cache: "no-store" });
      if (response.ok) content.innerHTML = renderJobFile(await response.text());
      else content.textContent = `Could not load ${file}`;
    };
    tabs.append(button);
  }
  document.getElementById("viewer").showModal();
  tabs.querySelector("button")?.click();
}

document.getElementById("viewer").addEventListener("click", event => {
  if (event.target.id === "viewer") event.target.close();
});

async function poll() {
  const status = document.getElementById("status");
  try {
    const response = await fetch("board.json", { cache: "no-store" });
    render(await response.json());
    status.textContent = "updated " + new Date().toLocaleTimeString();
  } catch (error) {
    status.textContent = "cannot read board.json — serve with python3 -m http.server 8000 --bind 127.0.0.1 -d .factory";
  }
}
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
